name: Release — Gate and draft

# A release claims more than "it builds": the tagged commit must have passed the
# unit/contract CI, the secret scan and a real SITL flight of the generated
# aircraft. This workflow checks all three for the exact commit, then drafts a
# prerelease with the SITL evidence attached. Publishing stays a manual step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Require green CI, security and SITL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sitl_run: ${{ steps.check.outputs.sitl_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse HEAD)
          status=0
          for workflow in ci.yml security.yml sitl.yml; do
            conclusion=$(gh run list --workflow "$workflow" --commit "$sha" --status success \
              --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
            echo "$workflow on $sha: $conclusion"
            [ "$conclusion" = "success" ] || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::$TAG ($sha) needs successful ci.yml, security.yml and sitl.yml runs"
            exit 1
          fi
          run_id=$(gh run list --workflow sitl.yml --commit "$sha" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "sitl_run=$run_id" >> "$GITHUB_OUTPUT"

  draft:
    name: Draft prerelease with SITL evidence
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SITL_RUN: ${{ needs.gate.outputs.sitl_run }}
        run: |
          gh run download "$SITL_RUN" --dir evidence
          tar czf sitl-evidence.tgz -C evidence .
          gh release create "$TAG" sitl-evidence.tgz --draft --prerelease \
            --verify-tag --generate-notes
