[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
cache_dir = .pytest-local-tmp/cache
addopts = -p no:cacheprovider
norecursedirs =
    .pytest_cache
    .test-tools
    .pip-tmp
    .pytest_tmp
    .pytest-local-tmp
    pytest_tmp_run
    __pycache__
filterwarnings =
    ignore:.*doesn't match a supported version.*
