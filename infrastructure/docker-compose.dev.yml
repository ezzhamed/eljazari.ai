
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
      POSTGRES_DB: droneprompt
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drone -d droneprompt']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - '6379:6379'

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_dev_data:/root/.ollama
    ports:
      - '11434:11434'

  dataset-bootstrap:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    profiles: ['bootstrap']
    restart: 'no'
    command: python -m scripts.bootstrap_aircraftverse --from-backup
    environment:
      AIRCRAFTVERSE_PATH: /app/data/aircraftverse/designs.json
    volumes:
      - ../data:/app/data

  ollama-bootstrap:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    profiles: ['bootstrap']
    restart: 'no'
    command: python -m scripts.bootstrap_ollama --pull-missing --wait-seconds 180
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2:latest}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}
      OLLAMA_EVAL_MODEL: ${OLLAMA_EVAL_MODEL:-llama3.2:latest}
    depends_on:
      ollama:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    restart: unless-stopped
    command: uvicorn main:socket_app --host 0.0.0.0 --port 8000 --reload --log-level debug
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://drone:drone@postgres:5432/droneprompt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: 'true'
      ENABLE_API_DOCS: 'true'
      ALLOW_ANONYMOUS_AUTH: 'true'
      API_SECRET_KEY: dev-secret-key-not-for-production
      LANGCHAIN_TRACING_V2: 'false'
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      TRUSTED_HOSTS: localhost,127.0.0.1,api
      AIRCRAFTVERSE_PATH: /app/data/aircraftverse/designs.json
      AIRCRAFTVERSE_REQUIRE_REAL: 'false'
      AIRCRAFTVERSE_RAG_MODE: memory
      STORAGE_PATH: /app/data/storage
    volumes:
      - ../apps/api:/app
      - ../data:/app/data
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /monorepo/apps/web
    command: sh -c "cd /monorepo && npm install && cd apps/web && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    volumes:
      - ..:/monorepo
      - web_node_modules:/monorepo/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - api

  celery_worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.celery
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=debug -Q simulation,default --concurrency=1
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://drone:drone@postgres:5432/droneprompt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: 'true'
      ALLOW_ANONYMOUS_AUTH: 'true'
      AIRCRAFTVERSE_PATH: /app/data/aircraftverse/designs.json
      AIRCRAFTVERSE_REQUIRE_REAL: 'false'
      STORAGE_PATH: /app/data/storage
    volumes:
      - ../apps/api:/app
      - ../data:/app/data
    depends_on:
      - redis
      - api
      - ollama

  simulation:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.sim
    profiles: ['simulation']
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      SIM_MODEL: ${SIM_MODEL:-x500}
      SIM_WORLD: ${SIM_WORLD:-default}
      PX4_MAVLINK_TARGET_HOST: ${PX4_MAVLINK_TARGET_HOST:-}
      PX4_HOME_LAT: ${PX4_HOME_LAT:-24.7136}
      PX4_HOME_LON: ${PX4_HOME_LON:-46.6753}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-620.0}
    network_mode: host
    volumes:
      - ../simulation:/simulation
      - ../data:/simulation/data:ro

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      FLOWER_PORT: '5555'
    # Dev credentials: admin / droneprompt (override via FLOWER_USER / FLOWER_PASSWORD)
    command: >-
      celery --broker=redis://redis:6379/1 flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-droneprompt}
    ports:
      - '127.0.0.1:5555:5555'
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: droneprompt
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  postgres_dev_data:
  redis_dev_data:
  ollama_dev_data:
  prometheus_dev_data:
  grafana_dev_data:
  web_node_modules:
