
x-api-common: &api-common
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile.api
  restart: unless-stopped
  init: true
  env_file: ../.env
  environment:
    ENVIRONMENT: production
    DEBUG: 'false'
    ENABLE_API_DOCS: 'false'
    ALLOW_ANONYMOUS_AUTH: 'false'
    ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-24}
    API_SECRET_KEY: ${API_SECRET_KEY:-change-me-in-production-32-chars!!}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-drone}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-droneprompt}
    REDIS_URL: redis://redis:6379/0
    # Several API workers share pipeline events through Redis; see Dockerfile.api.
    ELJAZARI_API_WORKERS: ${API_WORKERS:-1}
    ELJAZARI_SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2:latest}
    OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}
    OLLAMA_EVAL_MODEL: ${OLLAMA_EVAL_MODEL:-llama3.2:latest}
    LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
    LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
    LANGCHAIN_PROJECT: drone-prompt-prod
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api,web,nginx}
    ENABLE_HTTPS_REDIRECT: ${ENABLE_HTTPS_REDIRECT:-false}
    AIRCRAFTVERSE_PATH: /app/data/aircraftverse/designs.json
    AIRCRAFTVERSE_REQUIRE_REAL: 'true'
    AIRCRAFTVERSE_RAG_MODE: persistent
    STORAGE_PATH: /app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    ollama:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-droneprompt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # !! SECURITY: PostgreSQL is NOT exposed to the host in production.
    # Access it from other containers via the service name 'postgres:5432'.
    # Uncomment the line below ONLY for temporary local debugging:
    # ports:
    #   - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-drone} -d ${POSTGRES_DB:-droneprompt}']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Bound to localhost only — not reachable from outside the Docker network.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Bound to localhost only — models are served internally by the api service.
    ports:
      - '127.0.0.1:11434:11434'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true

  dataset-bootstrap:
    <<: *api-common
    profiles: ['bootstrap']
    restart: 'no'
    read_only: false
    cap_drop: []
    command: python -m scripts.bootstrap_aircraftverse --from-backup
    volumes:
      - ../data:/app/data

  ollama-bootstrap:
    <<: *api-common
    profiles: ['bootstrap']
    restart: 'no'
    read_only: true
    command: python -m scripts.bootstrap_ollama --pull-missing --wait-seconds 180
    volumes: []

  api:
    <<: *api-common
    read_only: true
    ports:
      - '8000:8000'
    volumes:
      - ../data:/app/data:ro
      - storage_data:/app/storage

  celery_worker:
    <<: *api-common
    read_only: true
    command: celery -A celery_app worker --loglevel=info -Q simulation,default --concurrency=1
    volumes:
      - ../data:/app/data:ro
      - storage_data:/app/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  simulation:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.sim
    profiles: ['simulation']
    restart: unless-stopped
    init: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      # Airframe and world. SIM_MODEL is the bare name; the entrypoint derives
      # PX4_SIM_MODEL=gz_<name>, matching GazeboService._px4_sim_model.
      SIM_MODEL: ${SIM_MODEL:-x500}
      SIM_WORLD: ${SIM_WORLD:-default}
      # Set when MAVSDK runs outside this container (the api service is on the
      # bridge network, so PX4's stock localhost link cannot reach it). Leave
      # empty for a same-host setup. An IPv4 address or a hostname (e.g.
      # host.docker.internal); the entrypoint resolves names because PX4 accepts
      # only an IP literal.
      PX4_MAVLINK_TARGET_HOST: ${PX4_MAVLINK_TARGET_HOST:-}
      PX4_HOME_LAT: ${PX4_HOME_LAT:-24.7136}
      PX4_HOME_LON: ${PX4_HOME_LON:-46.6753}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-620.0}
    network_mode: host
    volumes:
      - ../simulation:/simulation
      - ../data:/simulation/data:ro
    security_opt:
      - no-new-privileges:true

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    init: true
    # SECURITY: Basic-auth is enforced. Set FLOWER_USER and FLOWER_PASSWORD in .env
    command: >-
      celery flower
      --broker=redis://redis:6379/1
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-change-me-flower}
    ports:
      # Bound to localhost — access via SSH tunnel or VPN only, not publicly.
      - '127.0.0.1:5555:5555'
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8000}
    env_file: ../.env
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-grafana}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      prometheus:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    init: true
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  storage_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: droneprompt_network
