apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: droneprompt
  labels:
    app: celery-worker
    app.kubernetes.io/part-of: droneprompt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9691"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: celery-worker
          image: ghcr.io/ezzhamed/eljazari-agents/celery:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: droneprompt-config
            - secretRef:
                name: droneprompt-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command: ["celery", "-A", "celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
              readOnly: true
            - name: storage-volume
              mountPath: /app/storage
      volumes:
        - name: data-volume
          configMap:
            name: drone-data
        - name: storage-volume
          persistentVolumeClaim:
            claimName: storage-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-hpa
  namespace: droneprompt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
