apiVersion: v1
kind: ConfigMap
metadata:
  name: droneprompt-config
  namespace: droneprompt
  labels:
    app.kubernetes.io/part-of: droneprompt
data:
  # API settings
  DEBUG: "false"
  LOG_LEVEL: "info"
  MAX_ALTITUDE_M: "120.0"
  MAX_SPEED_MS: "15.0"
  MAX_SIMULATION_ITERATIONS: "5"

  # LLM
  OLLAMA_DEFAULT_MODEL: "qwen2.5:7b"
  OLLAMA_CODE_MODEL: "qwen2.5-coder:7b"
  OLLAMA_EVAL_MODEL: "llama3.2:3b"

  # Service URLs (internal K8s DNS)
  OLLAMA_BASE_URL: "http://ollama-service.droneprompt.svc.cluster.local:11434"
  REDIS_URL: "redis://redis-service.droneprompt.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://redis-service.droneprompt.svc.cluster.local:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service.droneprompt.svc.cluster.local:6379/2"

  # Frontend public URLs (set per environment)
  NEXT_PUBLIC_API_URL: "https://api.eljazari.ai"
  NEXT_PUBLIC_WS_URL: "https://api.eljazari.ai"

  # LangSmith tracing
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "drone-prompt-prod"
